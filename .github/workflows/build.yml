name: Recovery cBuild Android 15 - Verified Tree

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cleanup & Prepare Disk
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
        sudo docker image prune -a -f

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential zip curl scons libncurses5-dev git-core gnupg flex bison gperf libxml2-utils libssl-dev libcurl4-openssl-dev liblz4-tool python3 python-is-python3 openjdk-17-jdk m4 xsltproc unzip

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Sync TWRP AOSP Source
      run: |
        mkdir work && cd work
        repo init --u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-14 --depth=1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Your Forked Device Tree
      run: |
        cd work
        git clone https://github.com/${{ github.repository }} -b a15 device/tecno/li9

    - name: Execute Verified Build
      run: |
        cd work
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        source build/envsetup.sh
        # الصيغة الثلاثية الإجبارية لأندرويد 15 بناءً على ملفات naden01
        lunch twrp_li9-twrp-eng || lunch twrp_li9-trunk_staging-eng
        mka recoveryimage -j$(nproc --all)

    - name: Upload Final TWRP Image
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Tecno-Pova6Pro-A15
        path: work/out/target/product/li9/recovery.img
